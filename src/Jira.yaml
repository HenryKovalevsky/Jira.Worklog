openapi: 3.0.0
info:
  title: Jira Worklog API
  description: API for searching worklogs by author and adding worklogs to issues.
  version: 1.0.0
servers:
  - url: <server-url>
security:
  - basicAuth: []
paths:
  /rest/api/2/search:
    get:
      operationId: searchIssuesByWorklog
      summary: Search issues by worklog
      description: Returns issues whose worklogs match the JQL query. JQL filters worklogs by the current user and date range.
      parameters:
        - name: jql
          in: query
          required: true
          description: JQL query string.
          schema:
            type: string
            example: worklogAuthor=currentUser() AND worklogDate>=2026-08-10 AND worklogDate<=2026-08-16
        - name: fields
          in: query
          required: true
          description: Comma-separated list of fields to return.
          schema:
            type: array
            items:
              type: string
            example: username,key,worklog,summary
      responses:
        '200':
          description: Successful response with matching issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Bad request. JQL is invalid.
        '401':
          description: Authentication required.
        '403':
          description: Permission denied.
        '500':
          description: Internal server error.
  /rest/api/2/issue/{issueIdOrKey}/worklog:
    post:
      operationId: addWorklog
      summary: Add worklog to issue
      description: Adds a new worklog entry to the specified issue.
      parameters:
        - name: issueIdOrKey
          in: path
          required: true
          description: The ID or key of the issue.
          schema:
            type: string
            example: JIRA-15680
        - name: adjustEstimate
          in: query
          required: false
          description: Allows the user to provide a specific value for the new remaining estimate.
          schema:
            type: string
        - name: newEstimate
          in: query
          required: false
          description: The new value for the remaining estimate field.
          schema:
            type: string
        - name: reduceBy
          in: query
          required: false
          description: The amount to reduce the issue's remaining estimate by.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorklogRequest'
      responses:
        '201':
          description: Worklog created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worklog'
        '400':
          description: Bad request.
        '401':
          description: Authentication required.
        '403':
          description: Permission denied.
        '404':
          description: Issue not found.
        '500':
          description: Internal server error.
  /rest/api/2/myself:
    get:
      operationId: getMyself
      summary: Get details about the authenticated user
      description: Returns information about the user on behalf of whom the request was made.
      responses:
        '200':
          description: Successful response with details about the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication required.
        '403':
          description: Permission denied.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    SearchResponse:
      type: object
      properties:
        expand:
          type: string
          description: Contain additional expand information.
        startAt:
          type: integer
          format: int32
          description: The index of the first item returned.
        maxResults:
          type: integer
          format: int32
          description: The maximum number of results returned.
        total:
          type: integer
          format: int32
          description: The total number of issues that match the query.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    Issue:
      type: object
      properties:
        expand:
          type: string
          description: Contain additional expand information such as operations, renderedFields.
        id:
          type: string
          description: The ID of the issue.
        self:
          type: string
          format: uri
          description: The URL of the issue details.
        key:
          type: string
          description: The key of the issue.
        fields:
          $ref: '#/components/schemas/IssueFields'
    IssueFields:
      type: object
      properties:
        summary:
          type: string
          description: The summary of the issue.
        worklog:
          $ref: '#/components/schemas/WorklogPage'
    WorklogPage:
      type: object
      properties:
        startAt:
          type: integer
          format: int32
        maxResults:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        worklogs:
          type: array
          items:
            $ref: '#/components/schemas/Worklog'
    WorklogRequest:
      type: object
      required:
        - started
        - timeSpent
      properties:
        comment:
          type: string
          description: A comment about the worklog.
          example: Completed the integration tests for the authentication module.
        started:
          type: string
          description: The datetime when the worklog started.
          example: 2026-08-13T14:00:00.000+0000
        timeSpent:
          type: string
          description: The time spent on the issue, in Jira duration format (e.g. '5d', '4h', '30m').
          example: 2h 30m
    Worklog:
      type: object
      required:
        - id
        - issueId
        - author
        - updateAuthor
        - comment
        - created
        - updated
        - started
        - timeSpent
        - timeSpentSeconds
      properties:
        self:
          type: string
          format: uri
          description: The URL of the worklog.
        id:
          type: string
          description: The ID of the worklog.
        issueId:
          type: string
          description: The ID of the issue the worklog belongs to.
        author:
          $ref: '#/components/schemas/User'
        updateAuthor:
          $ref: '#/components/schemas/User'
        comment:
          type: string
          description: A comment about the worklog.
        created:
          type: string
          description: The datetime when the worklog was created.
        updated:
          type: string
          description: The datetime when the worklog was last updated.
        started:
          type: string
          description: The datetime when the worklog started.
        timeSpent:
          type: string
          description: The time spent on the issue, as a string.
        timeSpentSeconds:
          type: integer
          format: int64
          description: The time spent on the issue, in seconds.
    User:
      type: object
      required:
        - self
        - name
        - key
        - emailAddress
        - avatarUrls
        - additionalProperties
        - displayName
        - active
        - timeZone
      properties:
        self:
          type: string
          format: uri
        name:
          type: string
          description: User login name.
        key:
          type: string
        emailAddress:
          type: string
          format: email
        avatarUrls:
          type: object
          additionalProperties:
            type: string
            format: uri
        displayName:
          type: string
        active:
          type: boolean
        timeZone:
          type: string
          description: Time zone of the user.